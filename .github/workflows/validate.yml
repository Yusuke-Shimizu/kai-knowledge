# 正本（knowledge_base/）の front matter を検証する。
#
# 検証コードは **project-agent 側にあるものをそのまま使う**（同じ規則を2か所に置かない）。
# project-agent は public なのでトークンなしで checkout できる ―― 正本とコードを
# 別リポジトリに分けたときに、ここが効く。
#
# 検証の実体は project-agent の code/scripts/validate_knowledge.py。
# front matter の必須キー・doc_id の一意性・ファイル名との一致・置き場所と型の一致・
# supersedes の対称性・topic の allowlist 照合を見る。
#
# **エージェントが出す PR も人が出す PR も、同じこれを通る**（別経路を作らない）。

name: validate

on:
  pull_request:
    paths:
      - "knowledge_base/**"
      - "docs/topics.yml"
      - ".github/workflows/validate.yml"
  push:
    branches: [main]
    paths:
      - "knowledge_base/**"
      - "docs/topics.yml"
      - ".github/workflows/validate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  front-matter:
    name: front matter の検証
    runs-on: ubuntu-latest
    steps:
      - name: 正本を取る
        uses: actions/checkout@v7

      - name: 検証コードを取る（project-agent は public）
        uses: actions/checkout@v7
        with:
          repository: Yusuke-Shimizu/project-agent
          ref: main
          path: .validator

      # setup-uv は v8 以降メジャータグを公開しない。完全バージョンで指定する
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.12"
          enable-cache: true

      - name: 依存を入れる
        working-directory: .validator
        run: uv sync

      - name: 検証
        working-directory: .validator
        run: |
          uv run python code/scripts/validate_knowledge.py \
            --root "$GITHUB_WORKSPACE/knowledge_base" \
            --topics "$GITHUB_WORKSPACE/docs/topics.yml"
